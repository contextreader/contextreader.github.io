<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <style>
        /* ═══════════════════════════════════════════════════════════════
           Frosted glass — popup.  Retuned 2026-09-12, matching content.js.
           A popup has no page behind it, so the glass needs a field of its
           own. That field used to be amber + teal blooms; it is now a plain
           neutral gradient, because coloured light in the scene is the thing
           that made the old pass read as decorated rather than calm.
           ═══════════════════════════════════════════════════════════════ */
        :root {
            --space-xs: 3px;  --space-sm: 5px;  --space-md: 8px;
            --space-lg: 13px; --space-xl: 21px; --space-xxl: 34px;
            --phi: 1.618;
            --timing-fast: 0.236s;
            --timing-normal: 0.382s;

            --glass-top: rgba(255,255,255,0.66);
            --glass-bot: rgba(255,255,255,0.58);
            --glass-line: rgba(255,255,255,0.55);
            --glass-soft: rgba(255,255,255,0.70);
            --fx-body: blur(20px) saturate(105%) brightness(1.06) contrast(0.97);
            --fx-lens: none;   /* lens band retired — see content.js */
            --gel: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.34) 52%, rgba(255,255,255,0.50) 100%);
            /* neutral directional rim: one light source, top-left */
            --rim: linear-gradient(140deg,
                     rgba(255,255,255,0.95) 0%,
                     rgba(255,255,255,0.42) 28%,
                     rgba(255,255,255,0.18) 54%,
                     rgba(17,24,39,0.05) 80%,
                     rgba(17,24,39,0.11) 100%);
            /* dual-tone depth: light top-left, soft dark bottom-right */
            --spec:
              inset 0 1.5px 0 rgba(255,255,255,0.92),
              inset 1.5px 0 0 rgba(255,255,255,0.52),
              inset 0 18px 28px -20px rgba(255,255,255,0.75),
              inset -1.2px 0 0 rgba(17,24,39,0.05),
              inset 0 -1.2px 0 rgba(17,24,39,0.07),
              inset 0 -20px 26px -22px rgba(17,24,39,0.10);
            --spec-sm:
              inset 0 1.2px 0 rgba(255,255,255,0.92),
              inset 1.2px 0 0 rgba(255,255,255,0.50),
              inset 0 9px 13px -10px rgba(255,255,255,0.70),
              inset -1px -1px 0 rgba(17,24,39,0.06),
              inset 0 -9px 12px -11px rgba(17,24,39,0.10);

            --amber: #fbbf24;  --amber-hi: #fcd34d;
            --amber-deep: #a84e08; --amber-ink: #78350f;
            --amber-veil: rgba(251,191,36,0.10);
            --amber-glow: rgba(251,191,36,0.30);
            --teal: #0891b2; --teal-deep: #0e7490;

            --ink: #111827; --ink-soft: #374151; --ink-mute: #6b7280;
            --shadow: rgba(17,24,39,0.18);
        }

        * { box-sizing: border-box; }

        body {
            width: 300px;
            padding: var(--space-xl);
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            text-align: center;
            color: var(--ink-soft);
            position: relative;
            background:
              url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.035'/></svg>"),
              radial-gradient(ellipse 80% 55% at 22% -6%, rgba(255,255,255,0.95) 0%, transparent 64%),
              radial-gradient(ellipse 90% 50% at 78% 108%, rgba(17,24,39,0.05) 0%, transparent 62%),
              linear-gradient(158deg, #eef0f3 0%, #e4e7ec 52%, #dcdfe5 100%);
        }

        /* ── head ───────────────────────────────────────────────────── */
        .logo {
            font-size: 23px; font-weight: 800; letter-spacing: -0.5px;
            color: var(--ink); margin-bottom: var(--space-xs);
        }
        .subtitle {
            font-size: 12px; color: var(--ink-mute);
            margin-bottom: var(--space-xl); line-height: 1.4;
        }

        /* ── glass card: masked 1px iridescent rim ───────────────────── */
        .glass {
            position: relative;
            background: linear-gradient(180deg, var(--glass-top) 0%, var(--glass-bot) 100%);
            -webkit-backdrop-filter: var(--fx-body);
            backdrop-filter: var(--fx-body);
            border-radius: var(--space-xl);
            box-shadow:
              0 var(--space-lg) var(--space-xxl) -14px var(--shadow),
              var(--spec);
        }
        /* Lens band retired (--fx-lens: none). The rule is kept so the masked
           edge geometry stays available if the band is ever reinstated. */
        .glass::before{
            content:''; position:absolute; inset:0;
            border-radius:inherit; padding:var(--space-lg);
            -webkit-backdrop-filter:var(--fx-lens);
            backdrop-filter:var(--fx-lens);
            -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
            -webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
            mask-composite:exclude; pointer-events:none;
        }
        .glass::after {
            content: ''; position: absolute; inset: 0;
            border-radius: inherit; padding: 1px;
            background: var(--rim);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        .counter-card {
            padding: var(--space-lg) var(--space-lg) var(--space-xl);
            margin-bottom: var(--space-lg);
            box-shadow:
              0 var(--space-lg) var(--space-xxl) -14px var(--shadow),
              var(--spec);
        }
        .label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
            color: var(--ink-mute); font-weight: 700;
        }
        /* The number reads as the number. Gradient-filled text was a second
           coloured light source competing with the amber accent. */
        .count {
            font-size: 34px; font-weight: 800; line-height: 1.1;
            margin: var(--space-sm) 0 0;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        /* ── gel pills ───────────────────────────────────────────────── */
        .btn {
            display: flex; align-items: center; justify-content: center;
            gap: var(--space-md);
            width: 100%; padding: var(--space-lg);
            margin-top: var(--space-md);
            background: var(--gel), var(--glass-soft);
            -webkit-backdrop-filter: blur(var(--space-xl)) saturate(105%);
            backdrop-filter: blur(var(--space-xl)) saturate(105%);
            border: 1px solid var(--glass-line);
            border-radius: 100px;
            color: var(--ink-soft); text-decoration: none;
            font-family: inherit; font-size: 13px; font-weight: 600;
            cursor: pointer;
            transition: all var(--timing-fast);
            box-shadow:
              0 1px 2px rgba(17,24,39,0.07),
              0 var(--space-md) var(--space-xl) -11px rgba(17,24,39,0.25),
              var(--spec-sm);
        }
        .btn:hover {
            background: var(--gel), rgba(255,255,255,0.86);
            border-color: rgba(255,255,255,0.9);
            color: var(--ink);
            transform: translateY(-1px);
            box-shadow:
              0 var(--space-sm) var(--space-lg) -2px rgba(17,24,39,0.13),
              var(--spec-sm);
        }
        .btn:focus-visible { outline: 2px solid var(--amber-deep); outline-offset: 2px; }
        .btn:active { transform: translateY(0); }
        .btn svg { flex: 0 0 auto; display: block; }

        /* Primary by weight and hue, not by fill — same call as the bubble's
           More pill. A solid amber lozenge was the loudest object on the popup. */
        .btn-primary {
            background: var(--gel), var(--glass-soft);
            border-color: rgba(180,83,9,0.22);
            color: var(--amber-deep); font-weight: 700;
            box-shadow:
              0 1px 2px rgba(17,24,39,0.07),
              0 var(--space-md) var(--space-xl) -11px rgba(17,24,39,0.25),
              var(--spec-sm);
        }
        .btn-primary:hover {
            background:
              linear-gradient(0deg, var(--amber-veil), var(--amber-veil)),
              var(--gel), var(--glass-soft);
            border-color: rgba(180,83,9,0.38);
            color: var(--amber-deep);
        }


        /* ── inline notices ──────────────────────────────────────────── */
        .notice {
            padding: var(--space-lg); margin-bottom: var(--space-lg);
            text-align: left; border-radius: var(--space-lg);
            font-size: 11px; line-height: 1.5;
        }
        .notice-title {
            display: flex; align-items: center; gap: var(--space-sm);
            font-size: 12px; font-weight: 700; margin-bottom: var(--space-sm);
        }
        #restricted-page-msg {
            /* Neutral: teal was retired (palette decision, 15 Sep), and this is
               information, not a warning that earns amber. */
            background: var(--glass-soft); border: 1px solid var(--glass-line);
            color: var(--ink-soft); text-align: center; margin-top: var(--space-lg);
        }
        /* ── footer ──────────────────────────────────────────────────── */
        .foot {
            display: flex; justify-content: center; align-items: center;
            margin-top: var(--space-lg); padding-top: var(--space-lg);
            border-top: 1px solid rgba(17,24,39,0.07);
        }
        .foot span { font-size: 10px; color: #9ca3af; font-variant-numeric: tabular-nums; }

        /* Language switcher. The popup has room for a dropdown; the bubble does
           not, which is why that one only gets a one-shot EN button. */
        .lang-card {
            padding: var(--space-lg);
            margin-bottom: var(--space-lg);
            text-align: left;
        }
        .lang-card .label {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.1em; color: var(--ink-mute);
            margin-bottom: var(--space-md);
        }
        .lang-select {
            width: 100%;
            padding: var(--space-md) var(--space-xl) var(--space-md) var(--space-lg);
            background: var(--glass-soft);
            border: 1px solid var(--glass-line); border-radius: 100px;
            font-family: inherit; font-size: 12px; color: var(--ink);
            cursor: pointer; outline: none;
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%236b7280' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right var(--space-lg) center;
        }
        /* Search sits above the select. While a search is active the picker
           gives the select a size, turning it into a visible list of rows —
           which needs a box radius and no caret. */
        .lang-search {
            width: 100%; box-sizing: border-box;
            margin-bottom: var(--space-sm);
            padding: var(--space-md) var(--space-lg);
            background: var(--glass-soft);
            border: 1px solid var(--glass-line); border-radius: 100px;
            font-family: inherit; font-size: 12px; color: var(--ink); outline: none;
        }
        .lang-search::placeholder { color: var(--ink-mute); }
        /* Chrome draws the clear button blue — colour that carries nothing. */
        .lang-search::-webkit-search-cancel-button { filter: grayscale(1); opacity: 0.55; cursor: pointer; }
        .lang-count { font-size: 11px; color: var(--ink-mute); margin: 0 0 var(--space-sm) var(--space-lg); }
        .lang-count:empty { display: none; }
        .lang-select[size] {
            border-radius: var(--space-lg); padding: var(--space-sm);
            background-image: none; cursor: default;
        }
        .lang-select[size] option { padding: var(--space-sm) var(--space-md); border-radius: var(--space-sm); }
        .lang-select[hidden] { display: none; }
    </style>
</head>
<body>
    <div class="logo">Context Reader</div>
    <div class="subtitle">Context-aware definitions, in your language</div>

    <div class="lang-card glass">
        <div class="label">Explain in</div>
        <input id="popup-language-search" class="lang-search" type="search"
               placeholder="Search languages" aria-label="Search languages" autocomplete="off" spellcheck="false">
        <div id="popup-language-count" class="lang-count"></div>
        <select id="popup-language" class="lang-select"></select>
    </div>

    <div class="counter-card glass">
        <div class="label">Words looked up (this device)</div>
        <div class="count" id="global-count">…</div>
    </div>

    <a href="#" id="open-settings" class="btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.1 14.4a1.6 1.6 0 0 0 .3 1.8l.1.1a1.9 1.9 0 1 1-2.7 2.7l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a1.9 1.9 0 1 1-3.8 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a1.9 1.9 0 1 1-2.7-2.7l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a1.9 1.9 0 1 1 0-3.8h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a1.9 1.9 0 1 1 2.7-2.7l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a1.9 1.9 0 1 1 3.8 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a1.9 1.9 0 1 1 2.7 2.7l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1h.2a1.9 1.9 0 1 1 0 3.8h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
        Settings
    </a>

    <div id="restricted-page-msg" class="notice" style="display:none;">
        Context Reader works on regular web pages. Navigate to a website to start.
    </div>

    <div class="foot">
        <span id="version-label">v2.0</span>
    </div>

    <script src="lib/lang-picker.js"></script>
    <script src="popup.js"></script>
</body>
</html>
