<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 300px; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #fff; }
        .logo { font-size: 24px; font-weight: 800; color: #111827; margin-bottom: 5px; }
        .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
        
        .counter-card {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 1px solid #bae6fd;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #0369a1; font-weight: 700; }
        .count { font-size: 32px; font-weight: 800; color: #0284c7; margin: 5px 0; font-family: monospace; }
        
        .btn {
            display: block; width: 100%; padding: 10px; margin-top: 10px;
            background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
            color: #374151; text-decoration: none; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background: #f9fafb; border-color: #d1d5db; }
        .discord-btn { background: #5865F2; color: white; border: none; }
        .discord-btn:hover { background: #4752C4; }
    </style>
</head>
<body>
    <div class="logo">Context Reader</div>
    <div class="subtitle">Context-aware definitions in Sinhala</div>

    <div id="pdf-alert-box" style="display: none; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 8px; padding: 12px; margin-bottom: 15px; text-align: left;">
        <div style="font-size: 12px; font-weight: 700; color: #be123c; margin-bottom: 6px;">📄 PDF Detected</div>
        <p style="font-size: 11px; color: #881337; margin-bottom: 8px; line-height: 1.4;">
            Chrome's default viewer doesn't support translation.
        </p>
        <button id="open-pdf-btn" class="btn" style="background: #e11d48; color: white; border: none; font-size: 12px;">
            🚀 Open in Context Reader
        </button>
    </div>

    <div class="counter-card">
        <div class="label">Community Translations</div>
        <div class="count" id="global-count">...</div>
    </div>

    <div id="usage-card" style="background:linear-gradient(135deg,#fefce8 0%,#fef9c3 100%); border:1px solid #fde68a; border-radius:12px; padding:12px; margin-bottom:15px; text-align:left;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <div class="label" style="color:#92400e;">Today's Lookups</div>
            <div id="usage-text" style="font-size:13px; font-weight:700; color:#92400e;">...</div>
        </div>
        <div style="background:#fef3c7; border-radius:6px; height:8px; overflow:hidden;">
            <div id="usage-bar" style="background:#f59e0b; height:100%; border-radius:6px; width:0%; transition:width 0.3s;"></div>
        </div>
    </div>

    <button id="study-sheet-btn" class="btn" style="background:#fffbeb; border-color:#fbbf24; color:#92400e; font-weight:700;">📋 Generate Study Sheet</button>
    <a href="#" id="join-discord" class="btn discord-btn">💬 Join Community</a>
    <a href="#" id="open-settings" class="btn">⚙️ Settings</a>

    <div id="restricted-page-msg" style="display:none; background:#f0f9ff; border:1px solid #bae6fd; border-radius:8px; padding:12px; margin-top:12px; text-align:center;">
        <div style="font-size:12px; color:#0369a1; line-height:1.5;">Context Reader works on regular web pages. Navigate to a website to start.</div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:8px; border-top:1px solid #f3f4f6;">
        <a href="#" id="feedback-link" style="font-size:11px; color:#6b7280; text-decoration:none;">Feedback</a>
        <span id="version-label" style="font-size:10px; color:#9ca3af;">v2.0</span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
